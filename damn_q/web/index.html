<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAMN-Q Workbench</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">DAMN-Q</span>
      <span class="brand-badge" id="version-badge">v—</span>
    </div>

    <div class="toolbar-group">
      <label class="toolbar-label" for="example-select">Project</label>
      <select id="example-select" aria-label="Built-in experiments"></select>
      <button id="btn-load-example" class="btn" type="button">Load</button>
      <button id="btn-import" class="btn" type="button">Import JSON</button>
      <input id="file-import" type="file" accept=".json,application/json" hidden />
      <button id="btn-export" class="btn" type="button">Export JSON</button>
    </div>

    <div class="toolbar-group">
      <label class="toolbar-label" for="run-until">Until</label>
      <input id="run-until" class="input-sm" type="number" min="1" step="any" value="150" />
      <label class="toolbar-label" for="run-seed">Seed</label>
      <input id="run-seed" class="input-sm" type="number" step="1" placeholder="auto" />
    </div>

    <div class="toolbar-group toolbar-actions">
      <button id="btn-fit" class="btn" type="button" title="Fit graph to view">Fit</button>
      <button id="btn-validate" class="btn" type="button">Validate</button>
      <button id="btn-run" class="btn btn-primary" type="button">Run</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="palette" aria-label="Component palette">
      <div class="panel-header">
        <h2>Components</h2>
        <span class="hint">Click or drag to add</span>
      </div>
      <div id="palette-list" class="palette-list"></div>
      <div class="legend">
        <div class="legend-item"><span class="legend-wire quantum" aria-hidden="true"></span> Quantum wire</div>
        <div class="legend-item"><span class="legend-wire classical" aria-hidden="true"></span> Classical wire</div>
      </div>
    </aside>

    <section class="canvas-pane" aria-label="Experiment graph canvas">
      <div id="wiring-banner" class="wiring-banner" hidden>
        <span id="wiring-text">Select a compatible input port…</span>
        <button id="btn-cancel-wire" class="btn btn-xs" type="button">Cancel (Esc)</button>
      </div>
      <div class="canvas-controls" role="group" aria-label="Canvas controls">
        <button id="btn-replay-flow" class="btn flow-button" type="button" hidden>Replay qubit flow</button>
        <div class="zoom-controls" role="group" aria-label="Graph zoom">
          <button id="btn-zoom-out" class="btn" type="button" aria-label="Zoom out">−</button>
          <span id="zoom-label">100%</span>
          <button id="btn-zoom-in" class="btn" type="button" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div id="canvas-message" class="canvas-message" hidden>
        <span id="canvas-message-text" role="status"></span>
        <button id="btn-undo-delete" class="btn" type="button" hidden title="Undo (Ctrl or Command+Z)">Undo</button>
        <button id="btn-dismiss-message" class="btn" type="button" aria-label="Dismiss notification">×</button>
      </div>
      <div id="canvas-viewport" class="canvas-viewport" tabindex="0">
        <div id="canvas-world" class="canvas-world">
          <svg id="edge-layer" class="edge-layer"></svg>
          <div id="node-layer" class="node-layer"></div>
        </div>
      </div>
    </section>

    <aside class="right-pane" aria-label="Inspector and simulation results">
      <section class="inspector-section">
        <div class="panel-header">
          <h2 id="inspector-title">Experiment</h2>
          <button id="btn-select-exp" class="btn btn-xs" type="button" hidden>Experiment</button>
        </div>
        <div id="inspector-body" class="panel-body"></div>
      </section>

      <section class="results-section">
        <div class="panel-header">
          <h2>Results</h2>
          <span id="status-pill" class="status-pill neutral" role="status">Ready</span>
        </div>
        <div id="results-body" class="panel-body">
          <p class="muted">Run the experiment to see its results and replay qubit flow.</p>
        </div>
      </section>
    </aside>
  </main>

  <script src="/static/pyodide_bridge.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
